<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Title</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <!-- Bootstrap CSS v5.2.1 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <div class="conatiner-fluid bg-light">
        <div class="container">
          <nav class="navbar bg-light">
            <div class="container-fluid">
              <a class="navbar-brand">Add To Cart</a>
            </div>
          </nav>
        </div>
      </div>
    </header>
    <main>
      <div class="container-fluid">
        <div class="container">
          <div class="row">
            <div class="col-3">
              <div class="products">
                <div class="card" style="width: 18rem">
                  <img
                    src="https://b34959663f5a3997bd0d-2668915a1d3a077262c88fab6aa0aa02.ssl.cf3.rackcdn.com/17304451_3_640.jpg"
                    class="card-img-top"
                    alt="..."
                  />
                  <div class="card-body">
                    <h5 class="card-title">Rolax Watch</h5>
                    <p class="card-text">Price : 1150$</p>
                    <button
                      class="addToCart btn btn-primary"
                      data-name="Rolax watch"
                      data-price="1150"
                    >
                      Add to cart
                    </button>
                  </div>
                </div>
                <div class="card" style="width: 18rem">
                  <img
                    src="https://i.pinimg.com/736x/16/2a/0b/162a0b3c2f47b74735f564985d65adcb.jpg"
                    class="card-img-top"
                    alt="..."
                  />
                  <div class="card-body">
                    <h5 class="card-title">BOAt Ironmanearpots</h5>
                    <p class="card-text">Price : 12$</p>
                    <button
                      class="addToCart btn btn-primary"
                      data-name="BOAT Ironmanearpots"
                      data-price="12"
                    >
                      Add to cart
                    </button>
                  </div>
                </div>
              </div>
            </div>
            <div class="col-3">
              <div class="products">
                <div class="card" style="width: 18rem">
                  <img
                    src="https://tse4.mm.bing.net/th?id=OIP.D7si8t-ft2L0_BaWV5GsBwHaI4&pid=Api&P=0&h=180"
                    class="card-img-top"
                    alt="..."
                  />
                  <div class="card-body">
                    <h5 class="card-title">Leather Jacket(male) </h5>
                    <p class="card-text">Price : 30$</p>
                    <button
                      class="addToCart btn btn-primary"
                      data-name="Leather Jacket(male)"
                      data-price="30"
                    >
                      Add to cart
                    </button>
                  </div>
                </div>
                <div class="card" style="width: 18rem">
                  <img
                    src="https://assets.myntassets.com/h_200,w_200,c_fill,g_auto/h_1440,q_100,w_1080/v1/assets/images/11999704/2020/11/3/bae44908-30ed-4237-9fe8-dae29f8cabbb1604401775122-HRX-by-Hrithik-Roshan-Men-White-And-Fluorescent-Green-N-FLUX-1.jpg"
                    class="card-img-top"
                    alt="..."
                  />
                  <div class="card-body">
                    <h5 class="card-title"></h5>
                    <p class="card-text">Price : 15$</p>
                    <button
                      class="addToCart btn btn-primary"
                      data-name="HRX Man shoes"
                      data-price="15"
                    >
                      Add To Cart
                    </button>
                  </div>
                </div>
              </div>
            </div>
            <div class="col-6">
              <div class="cartSec">
                <h1>Your Cart</h1>
                <hr />
                <ul id="cartItems"></ul>
                <hr />
                <p id="totalAmt">Total: $0</p>

                <button class="btn btn-danger" id="checkOut">Check Out</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <footer>
      <!-- place footer here -->
    </footer>
    <!-- Bootstrap JavaScript Libraries -->
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
      integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
